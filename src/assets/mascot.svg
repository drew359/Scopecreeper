<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <!-- Shadow -->
  <ellipse cx="100" cy="210" rx="45" ry="10" fill="rgba(0,0,0,0.15)"/>

  <!-- Body (lower blob) -->
  <ellipse cx="100" cy="175" rx="38" ry="30" fill="#2563eb" stroke="#1e3a8a" stroke-width="2.5"/>

  <!-- Legs -->
  <ellipse cx="72" cy="202" rx="10" ry="7" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/>
  <ellipse cx="100" cy="206" rx="10" ry="7" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/>
  <ellipse cx="128" cy="202" rx="10" ry="7" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/>

  <!-- Head (main sphere) -->
  <circle cx="100" cy="115" r="60" fill="#3b82f6" stroke="#1e3a8a" stroke-width="3"/>
  <!-- Head shine -->
  <ellipse cx="82" cy="92" rx="18" ry="12" fill="rgba(255,255,255,0.25)" transform="rotate(-20 82 92)"/>

  <!-- Arms -->
  <!-- Left arm -->
  <path d="M46 120 Q20 110 18 125" stroke="#1e3a8a" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Left fist -->
  <circle cx="14" cy="128" r="10" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2.5"/>
  <circle cx="8" cy="124" r="5" fill="#60a5fa" stroke="#1e3a8a" stroke-width="1.5"/>
  <circle cx="14" cy="120" r="5" fill="#60a5fa" stroke="#1e3a8a" stroke-width="1.5"/>
  <circle cx="20" cy="124" r="5" fill="#60a5fa" stroke="#1e3a8a" stroke-width="1.5"/>

  <!-- Right arm -->
  <path d="M154 120 Q180 110 182 125" stroke="#1e3a8a" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Right fist -->
  <circle cx="186" cy="128" r="10" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2.5"/>
  <circle cx="180" cy="124" r="5" fill="#60a5fa" stroke="#1e3a8a" stroke-width="1.5"/>
  <circle cx="186" cy="120" r="5" fill="#60a5fa" stroke="#1e3a8a" stroke-width="1.5"/>
  <circle cx="192" cy="124" r="5" fill="#60a5fa" stroke="#1e3a8a" stroke-width="1.5"/>

  <!-- Eye stalks -->
  <!-- Left stalk -->
  <rect x="73" y="58" width="4" height="22" rx="2" fill="#1e3a8a" transform="rotate(-15 75 70)"/>
  <!-- Middle stalk -->
  <rect x="98" y="52" width="4" height="24" rx="2" fill="#1e3a8a"/>
  <!-- Right stalk -->
  <rect x="123" y="58" width="4" height="22" rx="2" fill="#1e3a8a" transform="rotate(15 125 70)"/>

  <!-- Left eye -->
  <circle cx="70" cy="46" r="18" fill="white" stroke="#1e3a8a" stroke-width="2.5"/>
  <circle cx="70" cy="46" r="12" fill="#2563eb"/>
  <circle cx="70" cy="46" r="6" fill="#1e1b4b"/>
  <circle cx="66" cy="42" r="3" fill="white"/>

  <!-- Middle eye (red) -->
  <circle cx="100" cy="38" r="19" fill="white" stroke="#1e3a8a" stroke-width="2.5"/>
  <circle cx="100" cy="38" r="13" fill="#dc2626"/>
  <circle cx="100" cy="38" r="6" fill="#1e1b4b"/>
  <circle cx="95" cy="33" r="3.5" fill="white"/>

  <!-- Right eye (green) -->
  <circle cx="130" cy="46" r="18" fill="white" stroke="#1e3a8a" stroke-width="2.5"/>
  <circle cx="130" cy="46" r="12" fill="#16a34a"/>
  <circle cx="130" cy="46" r="6" fill="#1e1b4b"/>
  <circle cx="126" cy="42" r="3" fill="white"/>

  <!-- Eyebrow lines -->
  <path d="M56 32 Q70 28 80 32" stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M86 24 Q100 20 114 24" stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M120 32 Q130 28 144 32" stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Mouth -->
  <path d="M70 143 Q100 158 130 143" stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round" fill="#7f1d1d"/>
  <!-- Teeth -->
  <rect x="82" y="143" width="9" height="8" rx="2" fill="white"/>
  <rect x="95" y="144" width="9" height="8" rx="2" fill="white"/>
  <rect x="109" y="143" width="9" height="8" rx="2" fill="white"/>
  <!-- Tongue -->
  <ellipse cx="100" cy="156" rx="8" ry="5" fill="#f9a8d4"/>
</svg>
